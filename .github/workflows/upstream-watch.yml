# Раз в неделю смотрит, появились ли новые коммиты Maasea/sgmodule в скриптах
# YouTube, и если да — открывает issue. Сам ничего не обновляет: новый код
# попадает в модуль только после ручного разбора (см. README, «Обновление»).
name: Новые версии Maasea

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сравнить с upstream.lock.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(jq -r .commit upstream.lock.json)
          latest=$(gh api "repos/Maasea/sgmodule/commits?path=Script/Youtube&per_page=1" --jq '.[0].sha')
          echo "закреплён: $pinned"
          echo "последний: $latest"
          [ "$pinned" = "$latest" ] && exit 0
          title="Maasea/sgmodule: новый коммит ${latest:0:7}"
          if gh issue list --state open --search "$title in:title" --json number --jq 'length' | grep -q '^0$'; then
            gh issue create --title "$title" --body "$(printf '%s\n\n%s\n\n%s\n' \
              "Закреплён коммит \`$pinned\`, в оригинале появился \`$latest\`." \
              "Изменения: https://github.com/Maasea/sgmodule/compare/$pinned...$latest" \
              "Обновление: \`node tools/update-upstream.mjs $latest\`, затем разбор диффа, \`node tools/build.mjs\`, \`node tools/verify.mjs\`, новый тег.")"
          fi
